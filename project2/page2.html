<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <!-- TODO: Import your CSS File here -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="container">
        <h1>Choose Your Character</h1>
        <form id="characterForm" type="get" action="page3.html">
            <fieldset>
                <legend>Choose Your Character</legend>
                <fieldset>
                    <input type="radio" id="aria" name="characterChoice">
                    <strong>Aria, the Warrior:</strong> Strong and brave, with the ability to overcome physical
                    obstacles.
                    </input>
                </fieldset>

                <fieldset>
                    <input type="radio" id="eldrin" name="characterChoice">
                    <strong>Eldrin, the Mage:</strong> Wise and knowledgeable, with the power to solve puzzles and cast
                    spells.
                    </input>
                </fieldset>

                <fieldset>
                    <input type="radio" id="tara" name="characterChoice">
                    <strong>Tara, the Rogue</strong> Quick and cunning, with skills in stealth and persuasion.
                    </input>
                </fieldset>

            </fieldset>
            <button type="submit">Continue</button>
        </form>
    </section>
</body>

</html>
